<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Market Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
            height: 100%;
            background: #000000;
            padding: 30px 35px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #222222;
            border-radius: 4px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
            border-bottom: 1px solid #222222;
            padding-bottom: 18px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .update-time {
            font-size: 13px;
            color: #888888;
            background: #111111;
            padding: 6px 14px;
            border: 1px solid #222222;
            border-radius: 2px;
            letter-spacing: 0.3px;
        }

        .market-status {
            font-size: 12px;
            color: #888888;
            background: #111111;
            padding: 6px 14px;
            border: 1px solid #222222;
            border-radius: 2px;
            letter-spacing: 0.3px;
        }

        .market-status.open {
            color: #00ff41;
            border-color: #00ff41;
        }

        .market-status.closed {
            color: #888888;
            border-color: #222222;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 28px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .assets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            min-height: 0;
            height: 100%;
        }

        .asset-card {
            background: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 2px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            min-height: 0;
            transition: border-color 0.3s ease;
        }

        .asset-card.up {
            border-color: #00ff41;
        }

        .asset-card.down {
            border-color: #ff0040;
        }

        .asset-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .asset-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .asset-name .ticker {
            color: #666666;
            font-weight: 400;
            font-size: 12px;
            margin-left: 8px;
        }

        .asset-price {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .change-badge {
            font-size: 14px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 2px;
            margin-left: 10px;
        }

        .change-badge.green {
            color: #00ff41;
            background: #001a08;
            border: 1px solid #00ff41;
        }

        .change-badge.red {
            color: #ff0040;
            background: #1a0006;
            border: 1px solid #ff0040;
        }

        .timeframes {
            display: flex;
            gap: 14px;
            margin-top: 10px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #666666;
            letter-spacing: 0.2px;
            border-top: 1px solid #111111;
            padding-top: 10px;
        }

        .timeframes span {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .timeframes .label {
            color: #444444;
            font-weight: 400;
        }

        .timeframes .val-green {
            color: #00ff41;
            font-weight: 500;
        }

        .timeframes .val-red {
            color: #ff0040;
            font-weight: 500;
        }

        .last-updated {
            font-size: 10px;
            color: #444444;
            margin-top: 6px;
            letter-spacing: 0.2px;
        }

        .cached-badge {
            font-size: 9px;
            color: #666666;
            background: #111111;
            padding: 2px 8px;
            border: 1px solid #222222;
            border-radius: 2px;
            margin-left: 8px;
            letter-spacing: 0.5px;
        }

        .news-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
            height: 100%;
        }

        .news-box {
            background: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 2px;
            padding: 18px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .news-box h3 {
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 600;
            color: #888888;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #111111;
            text-transform: uppercase;
        }

        .news-list {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
            flex: 1;
        }

        .news-item {
            padding: 10px 0;
            border-bottom: 1px solid #111111;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-item .title {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.5;
            color: #ffffff;
            cursor: default;
            letter-spacing: 0.2px;
        }

        .news-item .source {
            font-size: 10px;
            color: #444444;
            margin-top: 4px;
            display: block;
            letter-spacing: 0.2px;
        }

        .news-item .impact {
            display: inline-block;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 2px 10px;
            border-radius: 2px;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .impact.high {
            background: #1a0006;
            color: #ff0040;
            border: 1px solid #ff0040;
        }

        .impact.medium {
            background: #1a1a00;
            color: #888888;
            border: 1px solid #444444;
        }

        .loading {
            color: #444444;
            font-size: 13px;
            padding: 6px 0;
            letter-spacing: 0.2px;
        }

        @media (max-width: 1000px) {
            .grid {
                grid-template-columns: 1.4fr 1fr;
                gap: 18px;
            }
            .dashboard {
                padding: 20px;
            }
        }

        @media (max-width: 600px) {
            .asset-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .timeframes {
                font-size: 11px;
                gap: 8px;
            }
            .header h1 {
                font-size: 20px;
            }
            .assets {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(6, 1fr);
            }
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="dashboard" id="app">
    <div class="header">
        <h1>MARKET DASHBOARD</h1>
        <div class="header-right">
            <span class="market-status" id="marketStatus">⏳ CHECKING</span>
            <div class="update-time" id="updateTime">⏳ LOADING</div>
        </div>
    </div>

    <div class="grid">
        <div class="assets" id="assetsContainer">
            <!-- filled by JS -->
        </div>

        <div class="news-section">
            <div class="news-box" id="newsToday">
                <h3>📰 TODAY</h3>
                <div class="news-list"><div class="loading">Loading top stories...</div></div>
            </div>
            <div class="news-box" id="newsWeek">
                <h3>📆 THIS WEEK • HIGH IMPACT</h3>
                <div class="news-list"><div class="loading">Loading weekly stories...</div></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  CONFIG - ALL ASSETS USE YAHOO FINANCE
    // ============================================================
    const ASSETS = [
        { id: 'ES',   label: 'ES Futures',  symbol: 'ES=F' },
        { id: 'MNQ',  label: 'MNQ Futures', symbol: 'MNQ=F' },
        { id: 'NVDA', label: 'NVIDIA',      symbol: 'NVDA' },
        { id: 'SPCX', label: 'SpaceX',      symbol: 'SPCX' },
        { id: 'BTC',  label: 'Bitcoin',     symbol: 'BTC-USD' },
        { id: 'SOL',  label: 'Solana',      symbol: 'SOL-USD' },
    ];

    const priceCache = {};

    // ============================================================
    //  HELPERS
    // ============================================================
    function formatUSD(n) {
        if (n === undefined || n === null || isNaN(n)) return '—';
        if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
        if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
        if (n >= 1e3) return '$' + n.toFixed(2);
        return '$' + n.toFixed(4);
    }

    function formatChange(v) {
        if (v === undefined || v === null || isNaN(v)) return '—';
        return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
    }

    function changeClass(v) {
        if (v === undefined || v === null || isNaN(v)) return '';
        return v >= 0 ? 'green' : 'red';
    }

    function timeAgo(ts) {
        if (!ts) return 'Unknown';
        const diff = Date.now() - new Date(ts).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return 'Just now';
        if (mins < 60) return mins + 'm ago';
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + 'h ago';
        return Math.floor(hrs / 24) + 'd ago';
    }

    function isMarketOpen() {
        const now = new Date();
        const day = now.getDay();
        const hour = now.getHours();
        const minute = now.getMinutes();
        const time = hour + minute / 60;
        if (day >= 1 && day <= 5) {
            if (time >= 9.5 && time < 16) {
                return true;
            }
        }
        return false;
    }

    // ============================================================
    //  FETCH: CORS proxy helper
    // ============================================================
    const CORS_PROXIES = [
        (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    ];

    async function fetchViaProxy(url) {
        let lastErr = null;
        for (const buildProxyUrl of CORS_PROXIES) {
            const proxyUrl = buildProxyUrl(url);
            try {
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    const text = await res.text();
                    let parsed;
                    try {
                        parsed = JSON.parse(text);
                    } catch {
                        lastErr = new Error(`Non-JSON response via ${proxyUrl.split('?')[0]}: ${text.slice(0, 150)}`);
                        continue;
                    }
                    if (parsed?.chart?.error) {
                        lastErr = new Error(`Yahoo error: ${parsed.chart.error.description || JSON.stringify(parsed.chart.error)}`);
                        continue;
                    }
                    return { ok: true, json: async () => parsed };
                }
                const body = await res.text().catch(() => '');
                lastErr = new Error(`Proxy ${proxyUrl.split('?')[0]} returned ${res.status}: ${body.slice(0, 150)}`);
            } catch (e) {
                lastErr = new Error(`Proxy ${proxyUrl.split('?')[0]} failed: ${e.message}`);
            }
        }
        throw lastErr || new Error('All CORS proxies failed');
    }

    // ============================================================
    //  FETCH: Yahoo Finance
    // ============================================================
    async function fetchYahoo(symbol) {
        try {
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1y`;
            const res = await fetchViaProxy(url);
            
            if (!res.ok) {
                console.warn(`Yahoo API returned ${res.status} for ${symbol}`);
                return priceCache[symbol] || null;
            }
            
            const data = await res.json();
            
            if (!data.chart || !data.chart.result || data.chart.result.length === 0) {
                console.warn(`No data returned for ${symbol}`);
                return priceCache[symbol] || null;
            }

            const result = data.chart.result[0];
            const meta = result.meta;
            const quote = result.indicators?.quote?.[0];
            const closes = quote?.close || [];
            const timestamps = result.timestamp || [];
            
            let price = null;
            let prevClose = null;
            
            if (meta?.regularMarketPrice) {
                price = meta.regularMarketPrice;
            }
            
            if (!price && closes.length > 0) {
                for (let i = closes.length - 1; i >= 0; i--) {
                    if (closes[i] !== null && closes[i] !== undefined) {
                        price = closes[i];
                        break;
                    }
                }
            }
            
            if (!price && priceCache[symbol]) {
                return { ...priceCache[symbol], cached: true };
            }
            
            if (!price) {
                console.warn(`No price found for ${symbol}`);
                return priceCache[symbol] || null;
            }

            if (meta?.previousClose) {
                prevClose = meta.previousClose;
            } else if (closes.length > 1) {
                for (let i = closes.length - 2; i >= 0; i--) {
                    if (closes[i] !== null && closes[i] !== undefined) {
                        prevClose = closes[i];
                        break;
                    }
                }
            }
            
            if (!prevClose) {
                prevClose = price * 0.99;
            }

            const change = price - prevClose;
            const changePercent = (change / prevClose) * 100;

            let week = null, month = null, year = null;
            
            if (closes.length > 0 && timestamps.length > 0) {
                const today = new Date();
                const oneWeekAgo = new Date(today);
                oneWeekAgo.setDate(today.getDate() - 7);
                const oneMonthAgo = new Date(today);
                oneMonthAgo.setMonth(today.getMonth() - 1);
                const oneYearAgo = new Date(today);
                oneYearAgo.setFullYear(today.getFullYear() - 1);
                
                function getCloseForDate(target) {
                    let closestIdx = -1;
                    let closestDiff = Infinity;
                    
                    for (let i = 0; i < timestamps.length; i++) {
                        const d = new Date(timestamps[i] * 1000);
                        if (d <= target) {
                            const diff = target - d;
                            if (diff < closestDiff && closes[i] !== null && closes[i] !== undefined) {
                                closestDiff = diff;
                                closestIdx = i;
                            }
                        }
                    }
                    
                    if (closestIdx >= 0 && closestIdx < closes.length && closes[closestIdx]) {
                        return closes[closestIdx];
                    }
                    return null;
                }
                
                const weekClose = getCloseForDate(oneWeekAgo);
                const monthClose = getCloseForDate(oneMonthAgo);
                const yearClose = getCloseForDate(oneYearAgo);
                
                week = weekClose ? ((price - weekClose) / weekClose) * 100 : null;
                month = monthClose ? ((price - monthClose) / monthClose) * 100 : null;
                year = yearClose ? ((price - yearClose) / yearClose) * 100 : null;
            }

            const resultData = {
                price: price,
                change: change,
                changePercent: changePercent,
                week: week,
                month: month,
                year: year,
                cached: false,
                timestamp: new Date().toISOString()
            };

            priceCache[symbol] = resultData;
            return resultData;
        } catch (e) {
            console.warn('Yahoo fetch error for', symbol, e.message);
            if (priceCache[symbol]) {
                return { ...priceCache[symbol], cached: true };
            }
            return null;
        }
    }

    // ============================================================
    //  FETCH: News - DAILY = ALL, WEEKLY = HIGH IMPACT ONLY
    // ============================================================
    let newsCache = null;

    const HIGH_IMPACT_KEYWORDS = [
        'fed', 'federal reserve', 'rate', 'rates', 'interest rate',
        'inflation', 'cpi', 'ppi', 'jobs report', 'nonfarm payroll',
        'gdp', 'earnings', 'recession', 'crash', 'crisis',
        'bankruptcy', 'stimulus', 'jobs', 'unemployment',
        'central bank', 'ecb', 'boj', 'bank of england'
    ];

    function isHighImpact(title) {
        if (!title) return false;
        const lower = title.toLowerCase();
        return HIGH_IMPACT_KEYWORDS.some(keyword => lower.includes(keyword));
    }

    function getMonday(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        d.setDate(diff);
        d.setHours(0, 0, 0, 0);
        return d;
    }

    async function fetchAllNewsArticles() {
        const feeds = [
            'https://feeds.bloomberg.com/markets/news.rss',
            'https://www.cnbc.com/id/100003114/device/rss/rss.html',
        ];
        const proxy = 'https://api.rss2json.com/v1/api.json?rss_url=';
        let combined = [];

        for (const feed of feeds) {
            try {
                const feedUrl = encodeURIComponent(feed);
                const res = await fetch(proxy + feedUrl);
                const data = await res.json();
                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    combined = combined.concat(data.items.map(item => ({
                        title: item.title || 'Untitled',
                        source: item.author || 'Market Feed',
                        url: item.link,
                        publishedAt: item.pubDate,
                        description: item.description,
                    })));
                }
            } catch (feedErr) {
                console.warn('Feed error, trying next:', feedErr.message);
                continue;
            }
        }
        return combined;
    }

    function fallbackNews() {
        const now = Date.now();
        return [
            { title: 'Markets await Federal Reserve signals', source: 'Market Update', publishedAt: new Date(now - 2 * 60 * 60 * 1000).toISOString() },
            { title: 'Tech sector leads gains today', source: 'Market Update', publishedAt: new Date(now - 6 * 60 * 60 * 1000).toISOString() },
            { title: 'Oil prices steady amid geopolitical tensions', source: 'Market Update', publishedAt: new Date(now - 3 * 24 * 60 * 60 * 1000).toISOString() },
            { title: 'Inflation data beats expectations', source: 'Market Update', publishedAt: new Date(now - 5 * 60 * 60 * 1000).toISOString() },
            { title: 'Jobs report shows strong growth', source: 'Market Update', publishedAt: new Date(now - 2 * 24 * 60 * 60 * 1000).toISOString() },
            { title: 'Central banks coordinate policy action', source: 'Market Update', publishedAt: new Date(now - 3 * 24 * 60 * 60 * 1000).toISOString() },
        ];
    }

    function classifyNews(articles) {
        const now = Date.now();
        const sorted = [...articles].sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));

        // TODAY: ALL news from the last 24 hours (no filter)
        const today = sorted.filter(a => {
            const age = now - new Date(a.publishedAt).getTime();
            return age >= 0 && age < 24 * 60 * 60 * 1000;
        });

        // THIS WEEK: Monday to now, but EXCLUDING today, and HIGH IMPACT ONLY
        const monday = getMonday(now);
        const mondayMs = monday.getTime();
        
        const week = sorted.filter(a => {
            const pubMs = new Date(a.publishedAt).getTime();
            // Must be ON or AFTER Monday, BEFORE today, AND high impact
            return pubMs >= mondayMs && 
                   pubMs < (now - 24 * 60 * 60 * 1000) && 
                   isHighImpact(a.title);
        });

        return { today, week };
    }

    async function fetchNewsData() {
        try {
            const articles = await fetchAllNewsArticles();
            if (articles.length > 0) {
                newsCache = articles;
                return classifyNews(articles);
            }
            const fallback = fallbackNews();
            newsCache = fallback;
            return classifyNews(fallback);
        } catch (e) {
            console.warn('News fetch error:', e);
            const fallback = fallbackNews();
            newsCache = fallback;
            return classifyNews(fallback);
        }
    }

    // ============================================================
    //  RENDER
    // ============================================================
    function renderAssets(assetData) {
        const container = document.getElementById('assetsContainer');
        let html = '';

        const all = [];

        ASSETS.forEach(a => {
            const d = assetData[a.id];
            if (d && d.price !== undefined && d.price !== null) {
                all.push({
                    id: a.id,
                    label: a.label,
                    ticker: a.symbol,
                    price: d.price,
                    changePercent: d.changePercent,
                    week: d.week,
                    month: d.month,
                    year: d.year,
                    change: d.change,
                    cached: d.cached || false,
                    timestamp: d.timestamp,
                });
            } else {
                all.push({
                    id: a.id,
                    label: a.label,
                    ticker: a.symbol,
                    price: null,
                    changePercent: null,
                    week: null,
                    month: null,
                    year: null,
                    change: null,
                    error: true,
                    cached: false,
                });
            }
        });

        all.forEach(item => {
            const hasError = item.error || item.price === null || item.price === undefined;
            const change = item.changePercent;
            const cls = changeClass(change);
            const changeStr = hasError ? '—' : formatChange(change);
            const priceStr = hasError ? '—' : formatUSD(item.price);
            const cardDirectionClass = hasError ? '' : (change >= 0 ? 'up' : 'down');
            
            const cachedBadge = item.cached ? '<span class="cached-badge">CACHED</span>' : '';
            const timestampStr = item.timestamp ? `Updated: ${new Date(item.timestamp).toLocaleTimeString()}` : '';

            html += `
                <div class="asset-card ${cardDirectionClass}">
                    <div class="asset-row">
                        <div class="asset-name">
                            ${item.label}
                            <span class="ticker">${item.ticker}</span>
                            ${cachedBadge}
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="asset-price">${priceStr}</span>
                            <span class="change-badge ${hasError ? '' : cls}">${changeStr}</span>
                        </div>
                    </div>
                    <div class="timeframes">
                        <span><span class="label">DAY</span> <span class="val-${hasError ? '' : cls}">${hasError ? '—' : formatChange(change)}</span></span>
                        <span><span class="label">WEEK</span> <span class="val-${changeClass(item.week)}">${hasError ? '—' : formatChange(item.week)}</span></span>
                        <span><span class="label">MONTH</span> <span class="val-${changeClass(item.month)}">${hasError ? '—' : formatChange(item.month)}</span></span>
                        <span><span class="label">YEAR</span> <span class="val-${changeClass(item.year)}">${hasError ? '—' : formatChange(item.year)}</span></span>
                    </div>
                    ${timestampStr ? `<div class="last-updated">${timestampStr}</div>` : ''}
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function renderNews(articlesToday, articlesWeek) {
        const todayBox = document.getElementById('newsToday');
        const weekBox = document.getElementById('newsWeek');

        function renderDailyItems(articles, limit = 5) {
            if (!articles || articles.length === 0) {
                return '<div class="loading">No stories today.</div>';
            }
            let html = '';
            articles.slice(0, limit).forEach(a => {
                const isHigh = isHighImpact(a.title);
                const impactLabel = isHigh ? 'HIGH IMPACT' : 'MEDIUM IMPACT';
                const impactClass = isHigh ? 'high' : 'medium';
                html += `
                    <div class="news-item">
                        <div class="title">${a.title || 'Untitled'}</div>
                        <span class="source">${a.source || 'Unknown'} · ${timeAgo(a.publishedAt)}</span>
                        <span class="impact ${impactClass}">${impactLabel}</span>
                    </div>
                `;
            });
            return html;
        }

        function renderWeeklyItems(articles, limit = 5) {
            if (!articles || articles.length === 0) {
                return '<div class="loading">No high-impact stories this week.</div>';
            }
            let html = '';
            articles.slice(0, limit).forEach(a => {
                html += `
                    <div class="news-item">
                        <div class="title">${a.title || 'Untitled'}</div>
                        <span class="source">${a.source || 'Unknown'} · ${timeAgo(a.publishedAt)}</span>
                        <span class="impact high">HIGH IMPACT</span>
                    </div>
                `;
            });
            return html;
        }

        todayBox.querySelector('.news-list').innerHTML = renderDailyItems(articlesToday, 20);
        weekBox.querySelector('.news-list').innerHTML = renderWeeklyItems(articlesWeek, 20);
    }

    // ============================================================
    //  UPDATE LOOP
    // ============================================================
    async function updateDashboard() {
        const timeEl = document.getElementById('updateTime');
        const marketStatusEl = document.getElementById('marketStatus');
        
        const open = isMarketOpen();
        marketStatusEl.textContent = open ? '● OPEN' : '● CLOSED';
        marketStatusEl.className = `market-status ${open ? 'open' : 'closed'}`;
        
        timeEl.textContent = '⏳ UPDATING...';

        try {
            const yahooPromises = ASSETS.map(asset => fetchYahoo(asset.symbol));
            const yahooData = await Promise.all(yahooPromises);

            const assetResults = {};
            ASSETS.forEach((asset, i) => {
                if (yahooData[i]) assetResults[asset.id] = yahooData[i];
            });

            const newsData = await fetchNewsData();
            const { today: todayNews, week: weekNews } = newsData;

            renderAssets(assetResults);
            renderNews(todayNews, weekNews);

            const now = new Date();
            timeEl.textContent = `UPDATED ${now.toLocaleTimeString()}`;
        } catch (err) {
            console.error('Update error:', err);
            timeEl.textContent = '⚠️ ERROR';
        }
    }

    // ============================================================
    //  START
    // ============================================================
    updateDashboard();
    setInterval(updateDashboard, 120000);
</script>
</body>
</html>
